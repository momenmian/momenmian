<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-label="Momen Miah - AI Engineer, LLM and automation systems at BRAC Bank PLC">
<defs>
  <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#7aa2f7">
      <animate attributeName="stop-color" values="#7aa2f7;#bb9af7;#7dcfff;#7aa2f7" dur="9s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#bb9af7">
      <animate attributeName="stop-color" values="#bb9af7;#7dcfff;#7aa2f7;#bb9af7" dur="9s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>
  <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#7aa2f7"/><stop offset="50%" stop-color="#bb9af7"/><stop offset="100%" stop-color="#7dcfff"/>
  </linearGradient>
  <radialGradient id="bgGlow" cx="22%" cy="18%" r="90%">
    <stop offset="0%" stop-color="#1a1b26"/><stop offset="100%" stop-color="#13141c"/>
  </radialGradient>
  <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#7dcfff" stop-opacity="0"/>
    <stop offset="48%"  stop-color="#7dcfff" stop-opacity="0.05"/>
    <stop offset="50%"  stop-color="#7dcfff" stop-opacity="0.55"/>
    <stop offset="52%"  stop-color="#7dcfff" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#bb9af7" stop-opacity="0"/>
  </linearGradient>
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#c0caf5" opacity="0.030"/>
  </pattern>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="cardClip"><rect x="12" y="12" width="976" height="356" rx="14"/></clipPath>
  <mask id="reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="380">
    <rect x="0" y="0" width="1000" height="0" fill="#fff">
      <animate attributeName="height" from="0" to="380" dur="1.5s" begin="0.1s" fill="freeze"
               calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    </rect>
  </mask>
<style>
    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .prompt { font-size: 13.5px; }
    .pgreen { fill: #9ece6a; }
    .pdim   { fill: #414868; }
    .ptext  { fill: #565f89; }
    .name   { font-size: 46px; font-weight: 700; letter-spacing: 1.5px; }
    .role   { font-size: 15.5px; fill: #7aa2f7; letter-spacing: 0.3px; }
    .rule   { stroke: #292e42; stroke-width: 1.5; }
    .log    { font-size: 13.5px; }
    .arrow  { fill: #414868; }
    .lkey   { fill: #c0caf5; }
    .ldot   { fill: #414868; }
    .lgreen { fill: #9ece6a; font-weight: 700; }
    .laccent{ fill: #7aa2f7; font-weight: 700; }
    .cursor { fill: #7aa2f7; }
    .panel  { fill: #1a1b26; stroke: #292e42; stroke-width: 1; }
    .ptitle { font-size: 11.5px; fill: #414868; letter-spacing: 2.6px; font-weight: 700; }
    .prule  { stroke: #292e42; stroke-width: 1; }
    .key    { font-size: 12.5px; fill: #565f89; }
    .val    { font-size: 12.5px; fill: #c0caf5; }
    .title  { font-size: 12px; fill: #414868; letter-spacing: 0.6px; }
    </style>
</defs>

<rect width="1000" height="380" rx="16" fill="url(#bgGlow)"/>
<rect x="12" y="12" width="976" height="356" rx="14" fill="#16161e" stroke="url(#borderGrad)" stroke-width="1.5"/>
<rect x="12" y="12" width="976" height="356" rx="14" fill="url(#scanlines)"/>

<g mask="url(#reveal)">
  <g clip-path="url(#cardClip)">
    <rect x="12" y="-90" width="976" height="90" fill="url(#scanGrad)">
      <animate attributeName="y" from="-90" to="380" dur="4.5s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <circle cx="40" cy="34" r="5.5" fill="#f7768e" opacity="0.9"/><circle cx="60" cy="34" r="5.5" fill="#e0af68" opacity="0.9"/><circle cx="80" cy="34" r="5.5" fill="#9ece6a" opacity="0.9"/>
  <text class="mono title" x="100" y="38">momen@bracbank: ~/profile</text>
  <line class="rule" x1="12" y1="56" x2="988" y2="56"/>
  <defs><clipPath id="t1"><rect x="44" y="74" width="0" height="22"><animate attributeName="width" from="0" to="430" dur="0.55s" begin="0.55s" fill="freeze" calcMode="linear"/></rect></clipPath><clipPath id="t2"><rect x="44" y="112" width="0" height="52"><animate attributeName="width" from="0" to="330" dur="0.5s" begin="1.15s" fill="freeze" calcMode="linear"/></rect></clipPath><clipPath id="t3"><rect x="44" y="166" width="0" height="24"><animate attributeName="width" from="0" to="400" dur="0.45s" begin="1.62s" fill="freeze" calcMode="linear"/></rect></clipPath><clipPath id="t4"><rect x="44" y="225" width="0" height="22"><animate attributeName="width" from="0" to="440" dur="0.4s" begin="2.25s" fill="freeze" calcMode="linear"/></rect></clipPath><clipPath id="t5"><rect x="44" y="253" width="0" height="22"><animate attributeName="width" from="0" to="440" dur="0.4s" begin="2.55s" fill="freeze" calcMode="linear"/></rect></clipPath><clipPath id="t6"><rect x="44" y="281" width="0" height="22"><animate attributeName="width" from="0" to="440" dur="0.4s" begin="2.85s" fill="freeze" calcMode="linear"/></rect></clipPath><clipPath id="t7"><rect x="578" y="128" width="0" height="22"><animate attributeName="width" from="0" to="356" dur="0.34s" begin="1.9s" fill="freeze" calcMode="linear"/></rect></clipPath><clipPath id="t8"><rect x="578" y="157" width="0" height="22"><animate attributeName="width" from="0" to="356" dur="0.34s" begin="2.05s" fill="freeze" calcMode="linear"/></rect></clipPath><clipPath id="t9"><rect x="578" y="186" width="0" height="22"><animate attributeName="width" from="0" to="356" dur="0.34s" begin="2.1999999999999997s" fill="freeze" calcMode="linear"/></rect></clipPath><clipPath id="t10"><rect x="578" y="215" width="0" height="22"><animate attributeName="width" from="0" to="356" dur="0.34s" begin="2.3499999999999996s" fill="freeze" calcMode="linear"/></rect></clipPath><clipPath id="t11"><rect x="578" y="244" width="0" height="22"><animate attributeName="width" from="0" to="356" dur="0.34s" begin="2.5s" fill="freeze" calcMode="linear"/></rect></clipPath><clipPath id="t12"><rect x="578" y="273" width="0" height="22"><animate attributeName="width" from="0" to="356" dur="0.34s" begin="2.65s" fill="freeze" calcMode="linear"/></rect></clipPath><clipPath id="t13"><rect x="578" y="302" width="0" height="22"><animate attributeName="width" from="0" to="356" dur="0.34s" begin="2.8s" fill="freeze" calcMode="linear"/></rect></clipPath><clipPath id="t14"><rect x="578" y="331" width="0" height="22"><animate attributeName="width" from="0" to="356" dur="0.34s" begin="2.95s" fill="freeze" calcMode="linear"/></rect></clipPath></defs>
  <text class="mono prompt" x="44" y="90" clip-path="url(#t1)"><tspan class="pgreen">momen@bracbank</tspan><tspan class="pdim"> ~ % </tspan><tspan class="ptext">./profile.sh --live</tspan></text><text class="mono name" x="44" y="152" clip-path="url(#t2)" fill="url(#nameGrad)" filter="url(#soft)">MOMEN MIAH</text><text class="mono role" x="44" y="184" clip-path="url(#t3)">AI Engineer  ·  LLM &amp; Automation Systems</text><line class="rule" x1="44" y1="206" x2="44" y2="206"><animate attributeName="x2" from="44" to="516" dur="0.6s" begin="2.0s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/></line><text class="mono log" x="44" y="240" clip-path="url(#t4)"><tspan class="arrow">&gt; </tspan><tspan class="lkey">BRACBankGPT</tspan><tspan class="ldot"> ........... </tspan><tspan class="lgreen">LIVE</tspan></text><text class="mono log" x="44" y="268" clip-path="url(#t5)"><tspan class="arrow">&gt; </tspan><tspan class="lkey">Qwen3-VL doc AI</tspan><tspan class="ldot"> ....... </tspan><tspan class="laccent">~200 docs/day</tspan></text><text class="mono log" x="44" y="296" clip-path="url(#t6)"><tspan class="arrow">&gt; </tspan><tspan class="lkey">RPA + email triage</tspan><tspan class="ldot"> .... </tspan><tspan class="laccent">180h/mo saved</tspan></text><rect class="cursor" x="44" y="311" width="10" height="17" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0;1" keyTimes="0;0.01;0.5;0.51;0.99;1" dur="1.1s" begin="3.35s" repeatCount="indefinite"/></rect><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.9s" fill="freeze"/><rect class="panel" x="556" y="62" width="400" height="296" rx="10"/><text class="mono ptitle" x="578" y="92">SYSTEM.INFO</text><line class="prule" x1="578" y1="106" x2="934" y2="106"/></g><g clip-path="url(#t7)"><text class="mono key" x="578" y="142">Role</text><text class="mono val" x="704" y="142">AI Engineer</text></g><g clip-path="url(#t8)"><text class="mono key" x="578" y="171">Company</text><text class="mono val" x="704" y="171">BRAC Bank PLC</text></g><g clip-path="url(#t9)"><text class="mono key" x="578" y="200">Team</text><text class="mono val" x="704" y="200">R&amp;D (AI and ML)</text></g><g clip-path="url(#t10)"><text class="mono key" x="578" y="229">Department</text><text class="mono val" x="704" y="229">Process Automation and R&amp;D</text></g><g clip-path="url(#t11)"><text class="mono key" x="578" y="258">Focus</text><text class="mono val" x="704" y="258">LLM · RAG · Document AI</text></g><g clip-path="url(#t12)"><text class="mono key" x="578" y="287">Education</text><text class="mono val" x="704" y="287">BRAC University, CSE</text></g><g clip-path="url(#t13)"><text class="mono key" x="578" y="316">Origin</text><text class="mono val" x="704" y="316">Dhaka, Bangladesh</text></g><g clip-path="url(#t14)"><text class="mono key" x="578" y="345">Status</text><text class="mono val" x="704" y="345">Building • Shipping • Writing</text></g>
</g>
</svg>
